{% set downloaded = song.is_downloaded() %}
{% if allow_downloading and song.status|string in ['Pending', 'Downloading'] %}
    <span
    class="text-lg md:text-2xl animate-pulse"
    title="Downloading"
    hx-target="closest td"
    hx-swap="innerHTML"
    hx-get="/fragments/songs/{{ song.song_id }}/download"
    hx-trigger="every 3s"
    >
        ⤓
    </span>
{% else %}
    {% if downloaded %}
    <button
    class="play-button text-lg md:text-2xl"
    song_id="{{ song.song_id }}"
    preview_offset="{{ song.sync_meta.meta_tags.preview if song.sync_meta and song.sync_meta.meta_tags and song.sync_meta.meta_tags.preview else 0 }}"
    title="Play"
    >
    ▶
    </button>
    {% endif %}
    {% if allow_downloading and not (song.sync_meta and song.sync_meta.pinned) %}
        <button
        class="text-lg md:text-2xl"
        title="{{ 'Force re-download' if downloaded else 'Request download' }}"
        hx-target="closest td"
        hx-swap="innerHTML"
        hx-post="/fragments/songs/{{ song.song_id }}/download{{ '?force_redownload=true' if downloaded else '' }}"
        >
            ⤓
        </button>
    {% endif %}
{% endif %}
